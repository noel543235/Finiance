<!DOCTYPE html>
<html>
<head>
    <title>Upload CSV/JSON File</title>
</head>
<body>
    <h1>Upload a cleaned CSV or JSON File</h1>

    <!-- Form for uploading CSV or JSON file -->
    <form action="{% url 'import_data' %}" method="POST" enctype="multipart/form-data">
        {% csrf_token %}
        
        <label for="file">Choose a file:</label>
        <input type="file" id="file" name="file" accept=".csv, .json" required><br><br>

        <button type="submit">Upload</button>
    </form>

    {% if error %}
    <p style="color: red;">{{ error }}</p>
    {% endif %}
</body>
</html>
