<!DOCTYPE html>
<html>
<head>
    <title>Imported Data</title>
    <style>
        .editable {
            cursor: pointer;
            background-color: #f0f0f0;
        }
    </style>
    <script>
        document.addEventListener("DOMContentLoaded", function() {
            document.getElementById("import-btn").addEventListener("click", function() {
            let extractedData = getTableData();


            fetch("import_result/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": getCsrfToken()
                },
                body: JSON.stringify({ data: extractedData })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    displayError(data.error);
                } else {
                    console.log("Server response:", data);
            }
        })
            .catch(error => console.error("Error:", error));
            });

            const table = document.querySelector("table");
            if (!table) return;

            let frequencyColumnIndex = -1;
            const headers = table.querySelectorAll("thead th");
            headers.forEach((th, index) => {
                if (th.innerText.trim().toLowerCase() === "frequency") {
                    frequencyColumnIndex = index;
                }
            });
            function displayError(message) {
                let errorDiv = document.getElementById("error-message");
                if (!errorDiv) {
                    errorDiv = document.createElement("p");
                    errorDiv.id = "error-message";
                    errorDiv.style.color = "red";
                    document.body.insertBefore(errorDiv, document.body.firstChild);
                }
                errorDiv.textContent = message;
            }

            function makeEditable(td, columnIndex) {
                const originalValue = td.innerText.trim();

                if (columnIndex === frequencyColumnIndex) {
                    // Create dropdown for "frequency"
                    const select = document.createElement("select");
                    const options = ["None", "Daily", "Weekly", "Biweekly", "Monthly", "Annually"]; // Blank option first
                    options.forEach(option => {
                        const opt = document.createElement("option");
                        opt.value = option;
                        opt.textContent = option;
                        if (option === originalValue) {
                            opt.selected = true;
                        }
                        select.appendChild(opt);
                    });

                    td.innerHTML = "";
                    td.appendChild(select);
                    select.focus();

                    // Wait for user selection
                    select.addEventListener("change", function() {
                        td.innerText = select.value || originalValue; // Keep original if blank selected
                    });

                    // Revert if user clicks away without selection
                    select.addEventListener("blur", function() {
                        if (!select.value) {
                            td.innerText = originalValue;
                        }
                    });
                } else {
                    // Default text input for other columns
                    const input = document.createElement("input");
                    input.type = "text";
                    input.value = originalValue;

                    td.innerHTML = "";
                    td.appendChild(input);
                    input.focus();

                    input.onblur = function() {
                        td.innerText = input.value;
                    };
                }
            }

            table.querySelectorAll("tbody td").forEach((td, index) => {
                const columnIndex = index % headers.length;
                td.addEventListener("click", function() {
                    makeEditable(td, columnIndex);
                });
            });
        });

    function getTableData() {
        let table = document.querySelector("table");
        let headers = Array.from(table.querySelectorAll("thead th")).map(th => th.innerText.trim());
        let data = [];

        table.querySelectorAll("tbody tr").forEach(row => {
            let rowData = {};
            let cells = row.querySelectorAll("td");

            cells.forEach((cell, index) => {
                rowData[headers[index]] = cell.innerText.trim();
            });

            data.push(rowData);
        });

        return data;
    }

    function getCsrfToken() {
        return document.querySelector("[name=csrfmiddlewaretoken]")?.value || "";
    }

    </script>
</head>
<body>
    <h1>Imported Data</h1>

    <!-- Placeholder for displaying errors -->
    <p id="error-message" style="color: red;"></p>

    {% if error %}
    <p style="color: red;">{{ error }}</p>
    {% endif %}

    {% if data %}
    <h2>Data:</h2>
    <table border="1">
        <thead>
            <tr>
                {% for key in data.0 %}
                    <th>{{ key }}</th>
                {% endfor %}
            </tr>
        </thead>
        <tbody>
            {% for row in data %}
            <tr>
                {% for key, value in row.items %}
                <td class="editable">{{ value }}</td>
                {% endfor %}
            </tr>
            {% endfor %}
        </tbody>
    </table>
    {% endif %}

    <!-- CSRF Token for JavaScript to use -->
    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">

    <div>
        <button id="import-btn" class="import-btn">Import</button>
    </div>

    <a href="{% url 'import_expenses' %}">Go back and upload another file</a>
</body>
</html>
