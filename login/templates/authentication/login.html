<head>
    <title>Login</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'login/signup.css' %}">
  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>

<body>
    <nav class="navbar navbar-expand-lg fixed-top mb-5 bg-body-tertiary">
        <div class="container-fluid">
          <a style="color: #2D2D2D;" class="navbar-brand" href="#">Finiance</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
              <li class="nav-item">
                <a style="color: #2D2D2D;" class="nav-link active" aria-current="page" href="http://127.0.0.1:8000/">Home</a>
              </li>
              <li class="nav-item">
                <a style="color: #2D2D2D;" class="nav-link" href="http://127.0.0.1:8000/savings">Savings</a>
              </li>
              <li class="nav-item">
                <a style="color: #2D2D2D;" class="nav-link" href="http://127.0.0.1:8000/expenses">Expenses</a>
              </li>
              <li class="nav-item">
                <a style="color: #2D2D2D;" class="nav-link" href="http://127.0.0.1:8000/accountinfo">Account Information</a>
              </li>
              <li class="nav-item">
                <a style="color: #2D2D2D;" class="nav-link" href="http://127.0.0.1:8000/resources">Resources</a>
              </li>
              <li class="nav-item">
                <a style="color: #2D2D2D;" class="nav-link" href="http://127.0.0.1:8000/login/login">Login</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    <div class="container border border-secondary border-3 rounded-3 pb-4 text-center " style="margin-top: 5%;">
        <h1 class="fw-bold" style="color: #1E3A5F;">Login</h1>
        {% if messages %}
        {% for message in messages %}
        <p style="color: red;">{{ message }}</p>
        {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}
            <div class="m-5">
                <label for="username" class="form-label text-start d-block">Username:</label>
                <input type="text" class="form-control" name="username" required>
            </div>
            <div class="m-5">
                <label for="password" class="form-label text-start d-block">Password:</label>
                <input type="password" class="form-control" name="password" required>
            </div>
            <div class="container d-flex justify-content-center text-center">
                <button type="submit" class="btn btn-warning fw-bold">Submit</button>
            </div>
        </form>
        <a href="{% url 'signup' %}" class="text-decoration-none">Don't have an account? Sign up here.</a>
    </div>
</body>

</html>
